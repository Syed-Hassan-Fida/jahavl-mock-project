# Copy to /etc/nginx/sites-available/jahavl-mock-project
# Then: ln -s /etc/nginx/sites-available/jahavl-mock-project /etc/nginx/sites-enabled/jahavl-mock-project
#
# App root on VPS: /var/www/jahavl-mock-project
# Upstream ports (must match deploy/ecosystem.config.cjs):
#   Next.js 3125 | Laravel API 8125 | Live SSE 8126
#
# This file listens only for jah.example.com. It does not use default_server,
# so it will not catch traffic meant for your other sites.
# Replace jah.example.com before you enable it.

server {
    listen 80;
    listen [::]:80;
    server_name jah.example.com;

    client_max_body_size 12m;

    location /api/v1/live {
        proxy_pass http://127.0.0.1:8126;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
