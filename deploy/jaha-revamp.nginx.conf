# Copy to /etc/nginx/sites-available/jaha-revamp
# Then: ln -s /etc/nginx/sites-available/jaha-revamp /etc/nginx/sites-enabled/jaha-revamp
#
# This file listens only for jah.example.com. It does not use default_server,
# so it will not catch traffic meant for your other sites.
# Replace jah.example.com before you enable it.
# Change 3015, 8015, and 8016 only if those ports are already taken,
# and change the same numbers in deploy/ecosystem.config.cjs and the frontend build env.

server {
    listen 80;
    listen [::]:80;
    server_name jah.example.com;

    client_max_body_size 12m;

    location /api/v1/live {
        proxy_pass http://127.0.0.1:8016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        gzip off;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
